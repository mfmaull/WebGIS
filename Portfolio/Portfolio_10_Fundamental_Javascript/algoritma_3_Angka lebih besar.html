<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Angka Terbesar</title>
</head>
<body>
  <h2>Masukkan dua angka</h2>
  <input type="number" id="angka1" placeholder="Angka pertama" />
  <input type="number" id="angka2" placeholder="Angka kedua" />
  <button onclick="cekTerbesar()">Tentukan Angka Terbesar</button>
  <p id="hasil3"></p>

  <script>
    function cekTerbesar() {
      const angka1 = parseInt(document.getElementById('angka1').value);
      const angka2 = parseInt(document.getElementById('angka2').value);

      let terbesar = angka1 > angka2 ? angka1 : angka2;
      document.getElementById('hasil3').textContent = `Angka terbesar adalah ${terbesar}`;
    }
  </script>
</body>
</html>
