    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode:"class",
            theme: {
                extend: {
                    colors: {
                        'nav-bg': '#005f73',
                        'heading-primary': '#0a9396',
                        'heading-secondary': '#005f73',
                        'border-accent': '#94d2bd',
                        'input-focus': '#0a9396',
                        'button-primary': '#0a9396',
                        'button-hover': '#005f73',
                        'table-header': '#0a9396',
                        'table-border': '#ccc',

                        'text-primary': '#333',
                    },
                    borderWidth: {
                        '1.5': '1.5px',
                    },
                    fontSize: {

                    },
                },

        };
    </script>

    <style>
        @media nav{}.list-square {
            list-style-type: square;
        }

        /* Tambahan styling toggle switch untuk dark mode */
        .toggle-switch {
            width: 50px;
            height: 20px;
            background: #f0f0f0;
            border-radius: 30px;
            position: relative;
            top: 2.5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .toggle-switch.dark {
            background: #222;
        }

        .toggle-ball {
            width: 17px;
            height: 17px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1.5px;
            left: 2px;
            transition: transform 0.3s ease;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
        }

        .toggle-switch.dark .toggle-ball {
            transform: translateX(30px);
            background: #333;
        }

        .toggle-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            fill: #f39c12;
            pointer-events: none;
        }

        .icon-sun {
            left: 6px;
            fill: #f39c12;
        }

        .icon-moon {
            right: 6px;
            fill: #f1c40f;
        }
    </style>
</head>

<body class="dark:bg-black bg-white font-sans text-text-primary dark:text-white leading-1.6 p-6 max-w-5xl mx-auto">

        <div id="themeToggle" class="toggle-switch" role="switch" aria-checked="false" tabindex="0" onclick="toggleTheme()" onkeypress="if(event.key==='Enter'){toggleTheme();}">

    <script>
        // Fungsi untuk mengatur toggle switch sesuai tema
        function updateToggleSwitch(isDark) {
            const toggle = document.getElementById("themeToggle");
            if (isDark) {
                toggle.classList.add("dark");
                toggle.setAttribute("aria-checked", "true");
            } else {
                toggle.classList.remove("dark");
                toggle.setAttribute("aria-checked", "false");
            }
        }

        // Load tema dari localStorage atau preferensi OS, dan update toggle switch
        function loadTheme() {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark");
                updateToggleSwitch(true);
            } else if (savedTheme === "light") {
                document.documentElement.classList.remove("dark");
                updateToggleSwitch(false);
            } else {
                // Cek preferensi sistem user default
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add("dark");
                    updateToggleSwitch(true);
                    localStorage.setItem("theme", "dark"); 
                } else {
                    document.documentElement.classList.remove("dark");
                    updateToggleSwitch(false);
                    localStorage.setItem("theme", "light");
                }
            }
        }

        // Fungsi toggle theme dan simpan di localStorage
        function toggleTheme() {
            const htmlElement = document.documentElement;
            const toggleSwitch = document.getElementById('themeToggle');
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                toggleSwitch.classList.remove('dark');
                toggleSwitch.setAttribute('aria-checked', 'false');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                toggleSwitch.classList.add('dark');
                toggleSwitch.setAttribute('aria-checked', 'true');
                localStorage.setItem('theme', 'dark');
            }
        }

        // set default theme dan toggle sesuai saved preference
        function initializeTheme() {
            const storedTheme = localStorage.getItem('theme');
            const htmlElement = document.documentElement;
            const toggleSwitch = document.getElementById('themeToggle');
            if (storedTheme === 'dark') {
                htmlElement.classList.add('dark');
                toggleSwitch.classList.add('dark');
                toggleSwitch.setAttribute('aria-checked', 'true');
            } else {
                // Default theme adalah light
                htmlElement.classList.remove('dark');
                toggleSwitch.classList.remove('dark');
                toggleSwitch.setAttribute('aria-checked', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initializeTheme);
    </script>
</body>
