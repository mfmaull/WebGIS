<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <script src="https://unpkg.com/maplibre-gl@^5.7.3/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^5.7.3/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body style="margin: 0;">
    <div id="map" style="height: 100vh; width: 100%"></div>

    <script>
      const MAP_SERVICE_KEY = "67acaad1aeee190e01e20459";
      const map = new maplibregl.Map({
        style: `https://basemap.mapid.io/styles/street-new-generation/style.json?key=${MAP_SERVICE_KEY}`,
        center: [106.82717425766694, -6.175403054116954],
        zoom: 15.5,
        pitch: 60,
        bearing: 0,
        container: "map",
        canvasContextAttributes: { antialias: true },
        attributionControl: true,
      });

      // Add zoom control to the map
      const navControl = new maplibregl.NavigationControl();
      map.addControl(navControl, 'top-right');

      map.on("load", () => {
        console.log("map loaded");
      });
    </script>
</body>
</html>
